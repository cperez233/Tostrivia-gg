# Busca en YouTube los videos que faltan en src/data/videos.json (npm run videos:sin-key)
# y sube el resultado. Corre solo cuando cambia video-sources.json, o a mano desde Actions.
name: Buscar videos

on:
  push:
    paths:
      - src/data/video-sources.json
      - .github/workflows/videos.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/find-videos.mjs
      - name: Subir videos.json
        run: |
          git diff --quiet src/data/videos.json && { echo "Nada nuevo."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/data/videos.json
          git commit -m "Videos encontrados por GitHub Actions"
          git push
